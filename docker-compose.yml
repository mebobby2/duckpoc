services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    environment:
      # Composer/DuckDB both want a writable home directory; the container's
      # default user has none. config/duckdb.php also pins DuckDB's own
      # extension_directory explicitly, but this covers Composer's cache too.
      HOME: /tmp
    depends_on:
      - mysql
    ports:
      # 8080, not 8000 — Docker already holds 8000 on this machine.
      - "8080:8000"
    # `docker compose up -d app` serves the report viewer on
    # http://localhost:8080. One-off artisan/composer commands still work via
    # `docker compose run --rm app <command>`, which overrides this.
    command: php artisan serve --host=0.0.0.0 --port=8000

  # The same app, pinned to MinIO instead of GCS, so both storage backends are
  # servable side by side: 8080 reads gs://, 8081 reads s3://.
  #
  # --no-reload is load-bearing, not a preference. `artisan serve` spawns a
  # `php -S` child and filters its environment through a hardcoded allowlist
  # (ServeCommand::$passthroughVariables), forwarding anything else as `false`
  # — i.e. explicitly unset. Without this flag DUCKDB_STORAGE never reaches the
  # process that handles requests, the child falls back to the config default,
  # and the page silently serves GCS while claiming to be MinIO. That cost a
  # round of wrong conclusions; verify a backend switch by stopping the backend.
  app-minio:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    environment:
      HOME: /tmp
      DUCKDB_STORAGE: s3
    depends_on:
      - mysql
      - minio
    ports:
      - "8081:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  # S3-compatible object storage on the same host, so the report can be
  # measured without the ~8 ms Auckland->Sydney round trip that dominates every
  # GCS number in this PoC. It is a latency control, not a production proposal:
  # localhost is FASTER than co-located GCS would be, so it gives an optimistic
  # floor rather than a realistic production figure.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9011"
    environment:
      MINIO_ROOT_USER: duckpoc
      MINIO_ROOT_PASSWORD: duckpoc-secret
    ports:
      - "9010:9000"
      - "9011:9011"
    volumes:
      - duckpoc-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # AlloyDB Omni: PostgreSQL 17 plus Google's in-memory columnar engine, run
  # locally so it can be measured on the same hardware as the DuckDB path.
  #
  # The comparison it exists to settle: DuckDB+DuckLake keeps reporting inside
  # the app process but needs a lake, a catalog and manual maintenance, while
  # AlloyDB could serve the app AND its reports from one Postgres — collapsing
  # MySQL, Mongo and the DuckLake catalog into a single system.
  #
  # Omni's documented sizing is 8 GB RAM per CPU. Docker currently has 17.25 GB
  # total and is also hosting MySQL, MinIO and the app, so this is deliberately
  # given few CPUs rather than many; raise both together if the columnar engine
  # needs a bigger store.
  #
  # /dev/shm is enlarged because the columnar engine keeps its column store in
  # shared memory, and Docker's 64 MB default silently caps it.
  alloydb:
    image: google/alloydbomni:17.5.0
    environment:
      POSTGRES_PASSWORD: duckpoc
      POSTGRES_DB: duckpoc
    ports:
      # 5433, not 5432 — leaves the default free for any local Postgres.
      - "5433:5432"
    volumes:
      - duckpoc-alloydb-data:/var/lib/postgresql/data
    shm_size: 2gb
    # All three are postmaster-context, so they cannot be set from a session —
    # they belong here rather than in ALTER SYSTEM so the configuration lives in
    # the repo instead of inside a Docker volume.
    #
    # shared_buffers is pinned because Omni otherwise sizes it to the whole
    # container (it came up at 13.4 GB), which over-commits a 17.25 GB Docker VM
    # that is also running MySQL, MinIO and the app.
    #
    # memory_size_in_mb is the columnar engine's in-memory store, and it is THE
    # dial for the ceiling test: the question is not "can it hold 500M rows" but
    # "how many bytes per row does the column store need".
    command: >
      -c google_columnar_engine.enabled=on
      -c google_columnar_engine.memory_size_in_mb=1024
      -c shared_buffers=2GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d duckpoc"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: duckpoc
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: duckpoc
      MYSQL_PASSWORD: password
    ports:
      # 3308, not 3307 — figured-webapp's test-mysql owns 3307, and running
      # both stacks at once is normal while cross-checking against the real
      # Figured reports.
      - "3308:3306"
    volumes:
      - duckpoc-mysql-data:/var/lib/mysql

volumes:
  duckpoc-minio-data:
  duckpoc-mysql-data:
  duckpoc-alloydb-data:
