services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    environment:
      # Composer/DuckDB both want a writable home directory; the container's
      # default user has none. config/duckdb.php also pins DuckDB's own
      # extension_directory explicitly, but this covers Composer's cache too.
      HOME: /tmp
    depends_on:
      - mysql
    # Idle by default — use `docker compose exec app <command>` or
    # `docker compose run --rm app <command>` to run artisan/composer.
    command: tail -f /dev/null

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: duckpoc
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: duckpoc
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - duckpoc-mysql-data:/var/lib/mysql

volumes:
  duckpoc-mysql-data:
